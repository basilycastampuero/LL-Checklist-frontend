# Sirve el SPA build. try_files hace el fallback a index.html para que
# React Router (createBrowserRouter) resuelva rutas como /catalog, /my-lists,
# etc. directamente al refrescar o entrar por URL profunda.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # La imagen no proxea al backend: en modo real hace falta un reverse proxy
    # delante que lleve /api y /web/image a Odoo (same-origin, ADR-005). Sin él,
    # el fallback de arriba respondía index.html con 200 a toda la API, Zod
    # fallaba con un HTML y el error era imposible de diagnosticar. Ahora la
    # API ausente es un 503 con el envelope del contrato, que normalizeError
    # entiende y la UI muestra como error real.
    location ~ ^/(api|web/image)/ {
        default_type application/json;
        return 503 '{"error":{"code":"INTERNAL","message":"No backend behind this image: build it with VITE_API_MODE=mock or put a reverse proxy to Odoo in front."}}';
    }

    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
