# Cabeceras de seguridad compartidas (tarea 4.20, hallazgo #9 del code-review).
#
# Viven en un snippet y no inline porque nginx NO acumula `add_header` entre
# niveles: si un `location` declara aunque sea uno, deja de heredar TODOS los
# del `server`. Los locations de mockServiceWorker.js y de los assets ya tienen
# su `add_header Cache-Control`, así que cada uno repite este include. Un solo
# archivo evita que las listas se desincronicen cuando se agregue una cabecera.
#
# `always` hace que salgan también en 4xx/5xx (el 503 de /api, un 404): sin él
# nginx las omite en las respuestas de error.

# Anti-clickjacking. `X-Frame-Options` cubre navegadores viejos; el moderno
# obedece `frame-ancestors`. Solo ese directivo de CSP, a propósito: un
# `script-src`/`default-src` completo podría romper el service worker de MSW o
# los estilos inline de Vite/Tailwind y merece su propia tarea.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

# Impide que el navegador "adivine" un tipo MIME distinto del declarado.
add_header X-Content-Type-Options "nosniff" always;

# Al navegar a otro origen se envía solo el origen, no la ruta (que puede
# llevar ids de listas privadas ni `?next=`). Es el default de los navegadores
# modernos; declararlo lo hace independiente de la versión y auditable.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
